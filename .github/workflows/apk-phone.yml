name: Build APK (phone)
# Repo te shudhu 2ta jinish lagbe: app er .html file + ei workflow file. Baki shob nijei toiri hoy.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [safe, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Create project files
        env:
          LINK_HOST: ${{ secrets.LINK_HOST }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -e
          mkdir -p "$(dirname 'package.json')"
          cat > 'package.json' <<'MEU_EOF_0'
          {
            "name": "meutalk-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/app": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/push-notifications": "^7.0.0",
              "@capacitor-firebase/authentication": "^7.0.0",
              "firebase": "^11.0.0",
              "@capacitor-community/admob": "^7.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          MEU_EOF_0
          mkdir -p "$(dirname 'capacitor.config.json')"
          cat > 'capacitor.config.json' <<'MEU_EOF_1'
          {
            "appId": "com.meutalk.app",
            "appName": "MEUTALK",
            "webDir": "www",
            "backgroundColor": "#07120d",
            "android": { "allowMixedContent": false },
            "plugins": { "FirebaseAuthentication": { "skipNativeAuth": true, "providers": ["google.com"] } }
          }
          MEU_EOF_1
          mkdir -p "$(dirname 'plugin-src/MeuGalleryPlugin.java')"
          cat > 'plugin-src/MeuGalleryPlugin.java' <<'MEU_EOF_2'
          package com.meutalk.app;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.util.Size;
          import android.webkit.MimeTypeMap;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Lists the phone's photos/videos (MediaStore) so the web UI can draw its own gallery grid. */
          @CapacitorPlugin(
              name = "MeuGallery",
              permissions = {
                  @Permission(alias = "media33", strings = { Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO }),
                  @Permission(alias = "media32", strings = { Manifest.permission.READ_EXTERNAL_STORAGE })
              }
          )
          public class MeuGalleryPlugin extends Plugin {
              private final ExecutorService pool = Executors.newFixedThreadPool(3);

              private String alias() { return Build.VERSION.SDK_INT >= 33 ? "media33" : "media32"; }

              private boolean granted() { return getPermissionState(alias()) == PermissionState.GRANTED; }

              private Uri uriFor(String type, long id) {
                  Uri base = "video".equals(type) ? MediaStore.Video.Media.EXTERNAL_CONTENT_URI : MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                  return ContentUris.withAppendedId(base, id);
              }

              @PluginMethod
              public void list(PluginCall call) {
                  if (!granted()) { requestPermissionForAlias(alias(), call, "afterPerm"); return; }
                  doList(call);
              }

              @PermissionCallback
              private void afterPerm(PluginCall call) {
                  if (!granted()) { call.reject("permission denied"); return; }
                  doList(call);
              }

              private void doList(final PluginCall call) {
                  final String type = call.getString("type", "all");
                  final int limit = call.getInt("limit", 90);
                  final int offset = call.getInt("offset", 0);
                  pool.execute(() -> {
                      try {
                          Uri files = MediaStore.Files.getContentUri("external");
                          String sel;
                          if ("image".equals(type)) sel = MediaStore.Files.FileColumns.MEDIA_TYPE + "=" + MediaStore.Files.FileColumns.MEDIA_TYPE_IMAGE;
                          else if ("video".equals(type)) sel = MediaStore.Files.FileColumns.MEDIA_TYPE + "=" + MediaStore.Files.FileColumns.MEDIA_TYPE_VIDEO;
                          else sel = MediaStore.Files.FileColumns.MEDIA_TYPE + " IN (" + MediaStore.Files.FileColumns.MEDIA_TYPE_IMAGE + "," + MediaStore.Files.FileColumns.MEDIA_TYPE_VIDEO + ")";
                          String[] proj = { MediaStore.Files.FileColumns._ID, MediaStore.Files.FileColumns.MEDIA_TYPE, MediaStore.Video.VideoColumns.DURATION };
                          Cursor c;
                          try {
                              c = runQuery(files, proj, sel, limit, offset);
                          } catch (Exception ex) {
                              // some devices do not expose "duration" on the Files table
                              proj = new String[] { MediaStore.Files.FileColumns._ID, MediaStore.Files.FileColumns.MEDIA_TYPE };
                              c = runQuery(files, proj, sel, limit, offset);
                          }
                          JSArray items = new JSArray();
                          if (c != null) {
                              while (c.moveToNext()) {
                                  JSObject o = new JSObject();
                                  o.put("id", String.valueOf(c.getLong(0)));
                                  o.put("type", c.getInt(1) == MediaStore.Files.FileColumns.MEDIA_TYPE_VIDEO ? "video" : "image");
                                  o.put("duration", c.getColumnCount() > 2 && !c.isNull(2) ? c.getLong(2) : 0);
                                  items.put(o);
                              }
                              c.close();
                          }
                          JSObject res = new JSObject();
                          res.put("items", items);
                          call.resolve(res);
                      } catch (Exception e) {
                          call.reject("list failed: " + e.getMessage());
                      }
                  });
              }

              private Cursor runQuery(Uri files, String[] proj, String sel, int limit, int offset) {
                  ContentResolver cr = getContext().getContentResolver();
                  if (Build.VERSION.SDK_INT >= 26) {
                      android.os.Bundle b = new android.os.Bundle();
                      b.putString(ContentResolver.QUERY_ARG_SQL_SELECTION, sel);
                      b.putStringArray(ContentResolver.QUERY_ARG_SORT_COLUMNS, new String[] { MediaStore.Files.FileColumns.DATE_ADDED });
                      b.putInt(ContentResolver.QUERY_ARG_SORT_DIRECTION, ContentResolver.QUERY_SORT_DIRECTION_DESCENDING);
                      b.putInt(ContentResolver.QUERY_ARG_LIMIT, limit);
                      b.putInt(ContentResolver.QUERY_ARG_OFFSET, offset);
                      return cr.query(files, proj, b, null);
                  }
                  return cr.query(files, proj, sel, null, MediaStore.Files.FileColumns.DATE_ADDED + " DESC LIMIT " + limit + " OFFSET " + offset);
              }

              @PluginMethod
              public void thumb(final PluginCall call) {
                  final String type = call.getString("type", "image");
                  final long id = Long.parseLong(call.getString("id", "0"));
                  pool.execute(() -> {
                      try {
                          Uri uri = uriFor(type, id);
                          Bitmap bm;
                          if (Build.VERSION.SDK_INT >= 29) {
                              bm = getContext().getContentResolver().loadThumbnail(uri, new Size(256, 256), null);
                          } else if ("video".equals(type)) {
                              bm = MediaStore.Video.Thumbnails.getThumbnail(getContext().getContentResolver(), id, MediaStore.Video.Thumbnails.MINI_KIND, null);
                          } else {
                              bm = MediaStore.Images.Thumbnails.getThumbnail(getContext().getContentResolver(), id, MediaStore.Images.Thumbnails.MINI_KIND, null);
                          }
                          if (bm == null) { call.reject("no thumb"); return; }
                          ByteArrayOutputStream bos = new ByteArrayOutputStream();
                          bm.compress(Bitmap.CompressFormat.JPEG, 78, bos);
                          JSObject res = new JSObject();
                          res.put("data", "data:image/jpeg;base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP));
                          call.resolve(res);
                      } catch (Exception e) {
                          call.reject("thumb failed: " + e.getMessage());
                      }
                  });
              }

              /** Copies the chosen item into app cache and returns a file path the WebView can fetch. */
              @PluginMethod
              public void copy(final PluginCall call) {
                  final String type = call.getString("type", "image");
                  final long id = Long.parseLong(call.getString("id", "0"));
                  pool.execute(() -> {
                      try {
                          Uri uri = uriFor(type, id);
                          ContentResolver cr = getContext().getContentResolver();
                          String mime = cr.getType(uri);
                          String ext = mime != null ? MimeTypeMap.getSingleton().getExtensionFromMimeType(mime) : null;
                          if (ext == null) ext = "video".equals(type) ? "mp4" : "jpg";
                          File dir = new File(getContext().getCacheDir(), "meu_pick");
                          dir.mkdirs();
                          File out = new File(dir, "pick_" + id + "_" + System.currentTimeMillis() + "." + ext);
                          try (InputStream in = cr.openInputStream(uri); OutputStream os = new FileOutputStream(out)) {
                              byte[] buf = new byte[64 * 1024];
                              int n;
                              while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                          }
                          JSObject res = new JSObject();
                          res.put("path", out.getAbsolutePath());
                          res.put("name", out.getName());
                          res.put("mime", mime != null ? mime : ("video".equals(type) ? "video/mp4" : "image/jpeg"));
                          res.put("size", out.length());
                          call.resolve(res);
                      } catch (Exception e) {
                          call.reject("copy failed: " + e.getMessage());
                      }
                  });
              }
          }
          MEU_EOF_2
          mkdir -p "$(dirname 'scripts/setup.sh')"
          cat > 'scripts/setup.sh' <<'MEU_EOF_3'
          #!/usr/bin/env bash
          # Run once: creates the Android project, adds the gallery plugin + permissions.
          set -e
          [ -d android ] || npx cap add android
          PKG_DIR=android/app/src/main/java/com/meutalk/app
          mkdir -p "$PKG_DIR"
          cp plugin-src/MeuGalleryPlugin.java "$PKG_DIR/MeuGalleryPlugin.java"
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA'
          package com.meutalk.app;

          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Process;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  final android.content.Context ctx = getApplicationContext();
                  final Thread.UncaughtExceptionHandler old = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      @Override public void uncaughtException(Thread t, Throwable e) {
                          try {
                              java.io.StringWriter sw = new java.io.StringWriter();
                    android.util.Log.e("MEUCRASH", "crash", e);
                              e.printStackTrace(new java.io.PrintWriter(sw));
                              Intent i = new Intent(ctx, CrashActivity.class);
                              i.putExtra("trace", sw.toString());
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                              ctx.startActivity(i);
                              try { Thread.sleep(400); } catch (Exception x) {}
                          } catch (Throwable x) {
                              if (old != null) old.uncaughtException(t, e);
                          }
                          Process.killProcess(Process.myPid());
                          System.exit(10);
                      }
                  });
                  registerPlugin(MeuGalleryPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          cat > "$PKG_DIR/CrashActivity.java" <<'JAVA2'
          package com.meutalk.app;

          import android.app.Activity;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class CrashActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  String t = getIntent().getStringExtra("trace");
                  TextView v = new TextView(this);
                  v.setText("MEUTALK crash report - screenshot ta pathao:\n\n" + t);
                  v.setTextSize(11);
                  v.setTypeface(Typeface.MONOSPACE);
                  v.setPadding(24, 60, 24, 60);
                  v.setTextIsSelectable(true);
                  ScrollView s = new ScrollView(this);
                  s.addView(v);
                  setContentView(s);
              }
          }
          JAVA2
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q CrashActivity "$MF"; then
            python3 - "$MF" <<'PY'
          import sys
          p=sys.argv[1]; s=open(p).read()
          s=s.replace('</application>','        <activity android:name=".CrashActivity" android:exported="false" android:process=":crash"/>\n    </application>'); open(p,'w').write(s)
          PY
          fi
          if ! grep -q READ_MEDIA_IMAGES "$MF"; then
            python3 - "$MF" <<'PY'
          import sys
          p=sys.argv[1]; s=open(p).read()
          perms='''    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          '''
          s=s.replace('</manifest>',perms+'</manifest>'); open(p,'w').write(s)
          PY
          fi
          [ -f firebase/google-services.json ] && cp firebase/google-services.json android/app/google-services.json || echo 'NOTE: firebase/google-services.json missing - push notifications disabled'
          # AdMob app id (TEST id by default - set ADMOB_APP_ID env / GitHub secret for real ads)
          if [ -n "$LINK_HOST" ] && ! grep -q "$LINK_HOST" "$MF"; then
            python3 - "$MF" "$LINK_HOST" <<'PY'
          import sys
          p,h=sys.argv[1],sys.argv[2]; s=open(p).read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="https" android:host="'+h+'"/></intent-filter>'
          s=s.replace('</activity>',f+'</activity>',1); open(p,'w').write(s)
          PY
          fi
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MF"; then
            python3 - "$MF" "${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}" <<'PY'
          import sys
          p,i=sys.argv[1],sys.argv[2]; s=open(p).read()
          s=s.replace('</application>','        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'+i+'"/>\n    </application>'); open(p,'w').write(s)
          PY
          fi
          npx cap sync android
          echo "Setup done."
          MEU_EOF_3
          mkdir -p www
          SRC=$(ls *.html 2>/dev/null | sort -V | tail -1)
          [ -n "$SRC" ] || { echo "ERROR: repo te app er .html file upload koro"; exit 1; }
          cp "$SRC" www/index.html
          GS=$(ls google-services*.json 2>/dev/null | head -1)
          [ -n "$GS" ] && { mkdir -p firebase; cp "$GS" firebase/google-services.json; } || true

      - name: Variant (safe = no Firebase Google login plugin / no google-services)
        if: matrix.variant == 'safe'
        run: |
          rm -f google-services.json firebase/google-services.json
          python3 - <<'PY'
          import json
          p=json.load(open('package.json'))
          for k in ['@capacitor-firebase/authentication','firebase','@capacitor/push-notifications']: p['dependencies'].pop(k,None)
          json.dump(p,open('package.json','w'),indent=2)
          c=json.load(open('capacitor.config.json')); c.pop('plugins',None); json.dump(c,open('capacitor.config.json','w'),indent=2)
          PY
      - name: Fixed signing key (same SHA-1 every build)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
      - run: npm install
      - run: bash scripts/setup.sh
      - name: App icon (MEUTALK logo)
        run: |
          pip install pillow --break-system-packages -q || pip install pillow -q
          echo '' | base64 -d > /tmp/fg.png
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          fg = Image.open('/tmp/fg.png').convert('RGBA')
          BG = (30, 143, 90, 255)
          res = 'android/app/src/main/res'
          for d, s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p = f'{res}/mipmap-{d}'; os.makedirs(p, exist_ok=True)
              big = fg.resize((int(s*1.6), int(s*1.6)), Image.LANCZOS)
              sq = Image.new('RGBA', (s, s), BG); sq.alpha_composite(big, ((s-big.width)//2, (s-big.height)//2))
              sq.convert('RGBA').save(f'{p}/ic_launcher.png')
              m = Image.new('L', (s, s), 0); ImageDraw.Draw(m).ellipse((0, 0, s-1, s-1), fill=255)
              r = sq.copy(); r.putalpha(m); r.save(f'{p}/ic_launcher_round.png')
              f = s*108//48; ff = fg.resize((f, f), Image.LANCZOS); ff.save(f'{p}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#1E8F5A</color></resources>')
          PY
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Keep APK for diagnosis
        if: matrix.variant == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: full-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ matrix.variant }}
          name: MEUTALK APK ${{ github.run_number }} (${{ matrix.variant }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
  diagnose:
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write test script
        run: |
          cat > diag.sh <<'SH'
          adb install -r app-debug.apk
          adb logcat -c
          adb shell monkey -p com.meutalk.app -c android.intent.category.LAUNCHER 1
          sleep 40
          adb logcat -d > logcat.txt
          SH
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          script: bash diag.sh
      - name: Show crash in summary
        if: always()
        run: |
          {
            echo '## Crash log (FULL build)'
            echo '```'
            grep -n -A22 "MEUCRASH\|FATAL EXCEPTION" logcat.txt | head -70 || true
            echo '```'
            echo 'Alive after 40s?'
            grep -c "Displayed com.meutalk.app" logcat.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
